# --------------------------------------------------------------------------
# 苦労したこと（1〜3件。見出しは14文字以内、何が起きたか・どう解決したかは各50文字程度）
# 下の3件はテスト仕様書の備考から拾った下書き。チームの実感と違えば書き換える
# --------------------------------------------------------------------------
苦労したこと:
  - 見出し: 仕様書と実装の食い違い
    何が起きたか: URLのコンテキストルート（/emp_sys/ と /empsys/）や、氏名・フリガナの文字数上限が設計書と実装で違っていた
    どう解決したか: テスト結果の備考に差異を記録し、どちらを正とするかチームで決めた
  - 見出し: 削除確認ダイアログの不具合
    何が起きたか: キャンセルを押してもフォームが送信され、選択が外れてしまっていた
    どう解決したか: onClick を return operation('delete') に変え、関数の最後で false を返すよう修正
  - 見出し: 仕様のあいまいさ
    何が起きたか: 所属を未選択のまま登録できるか、全角と半角の従業員コードを同じとみなすかが決まっていなかった
    どう解決したか: 所属は任意項目、全角と半角は別のコードとして扱う方針に決め、テスト仕様書に反映

