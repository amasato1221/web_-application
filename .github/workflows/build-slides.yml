# 記入シート.yml が更新されたら、成果発表会の資料（pptx）を自動で作り直してコミットする
name: 発表資料の自動生成

on:
  push:
    branches:
      - claude/quirky-planck-p9p7xg
    paths:
      - "記入シート.yml"
      - "tools/**"
      - ".github/workflows/build-slides.yml"
  workflow_dispatch:

permissions:
  contents: write

# 同時に複数人が保存しても、順番に1回ずつ処理する
concurrency:
  group: build-slides-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: 依存パッケージのインストール
        run: npm ci

      - name: 生成ツールのテスト
        run: npm test

      - name: 記入シートから資料を生成
        run: npm run build

      - name: 生成した資料をコミット
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "成果発表会資料_テンプレート.pptx"
          if git diff --cached --quiet; then
            echo "資料に変更はありません"
            exit 0
          fi
          git commit -m "発表資料を記入シートから自動生成"
          # 生成中に別の人が保存していた場合に備えて、取り込んでから push する
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
